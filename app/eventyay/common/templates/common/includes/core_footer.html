{% load i18n %}
{% load safelink %}

{% if core_footer_links %}
<div class="core-footer-links-container" style="margin-top: 8px;">
    {% for link in core_footer_links %}
        <a href="{% safelink link.url %}"
           style="margin: 0 10px; color: inherit; text-decoration: none;"
           {% if link.target_blank %}target="_blank" rel="noopener"{% endif %}>
            {{ link.label }}
        </a>
    {% endfor %}
</div>
{% endif %}
